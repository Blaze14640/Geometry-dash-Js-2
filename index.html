<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mini Geometry Dash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu">
  <button onclick="startGame()">▶️ Começar</button>
  <button onclick="endGame()">⏹️ Encerrar</button>
  <button onclick="increaseDifficulty()">⚡ Dificuldade +</button>
  <button onclick="reduceDifficulty()">🐢 Dificuldade -</button>
</div>

<div id="game">
  <div id="ground"></div>
  <div id="player"></div>
  <div id="score">0</div>
</div>

<script src="script.js"></script>
</body>
</html>
